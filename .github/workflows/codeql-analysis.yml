name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '21 13 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
      with:
        languages: ${{ matrix.language }}
    - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd
    - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
